<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web2App Studio | Turn Website into Android Mobile App | Daffy International</title>
  <meta name="description" content="Convert your website, web app, or HTML5 game into a high-performance Android mobile application with custom branding, AdMob monetization, and Play Store readiness.">
  <link rel="icon" type="image/jpeg" href="icon.png.jpg">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --primary: #00d2ff;
      --primary-glow: rgba(0, 210, 255, 0.25);
      --secondary: #3a7bd5;
      --fiverr-green: #1dbf73;
      --whatsapp-green: #25d366;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      padding: 16px 0;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(0, 210, 255, 0.4);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.25);
    }

    .logo-text {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text span {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-badge {
      font-size: 10px;
      background: rgba(0, 210, 255, 0.1);
      color: var(--primary);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.25);
    }

    .btn-whatsapp:hover {
      background: #20ba5a;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
    }

    .btn-fiverr {
      background: #1dbf73;
      color: #fff;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(29, 191, 115, 0.25);
    }

    .btn-fiverr:hover {
      background: #19a463;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(29, 191, 115, 0.4);
    }

    .btn-email {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: var(--primary);
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-email:hover {
      background: rgba(0, 210, 255, 0.2);
      transform: translateY(-2px);
    }

    .cta-btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 11px 22px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .cta-btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Hero */
    .hero {
      padding: 85px 0 60px;
      text-align: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.2);
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 22px;
      font-weight: 600;
    }

    .hero h1 {
      font-size: 46px;
      font-weight: 800;
      line-height: 1.2;
      max-width: 860px;
      margin: 0 auto 20px;
      letter-spacing: -0.5px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 50%, #90e0ef 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 17px;
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 34px;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 45px;
      margin: 50px 0 10px;
      padding: 22px;
      background: rgba(17, 24, 39, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    section {
      padding: 65px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 15.5px;
      max-width: 580px;
      margin: 0 auto;
    }

    /* Portfolio Cards Grid */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
    }

    .portfolio-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .portfolio-card:hover {
      border-color: var(--primary);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .portfolio-preview {
      height: 150px;
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.08), rgba(58, 123, 213, 0.12));
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .preview-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
    }

    .preview-icon {
      font-size: 44px;
    }

    .portfolio-content {
      padding: 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .portfolio-category {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .portfolio-title {
      font-size: 17.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .portfolio-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .portfolio-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .p-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .portfolio-link {
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 28px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .feature-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
    }

    .feature-icon {
      font-size: 28px;
      margin-bottom: 14px;
    }

    .feature-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .feature-card p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Pricing */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
      max-width: 1040px;
      margin: 0 auto;
    }

    .pricing-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 36px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .pricing-card.featured {
      border-color: var(--primary);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.15);
    }

    .featured-tag {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .plan-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .plan-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      min-height: 40px;
    }

    .plan-price {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 24px;
    }

    .plan-price span {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .plan-features {
      list-style: none;
      margin-bottom: 30px;
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
    }

    .plan-features li {
      font-size: 13.5px;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .plan-features li::before {
      content: "✔";
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    /* 3-Column Contact Channels */
    .contact-channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }

    .contact-channel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 30px 24px;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .contact-channel-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
    }

    .channel-icon {
      font-size: 36px;
      margin-bottom: 14px;
    }

    .channel-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .channel-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 20px;
      min-height: 40px;
    }

    .location-info {
      text-align: center;
      margin-top: 35px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* Floating WhatsApp Button */
    .floating-whatsapp {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #25d366;
      color: #fff;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      z-index: 999;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .floating-whatsapp:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(37, 211, 102, 0.6);
    }

    .floating-whatsapp svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--card-border);
      padding: 40px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 32px; }
      .hero p { font-size: 15px; }
      .nav-links { display: none; }
      .header-actions { gap: 6px; }
      .btn-whatsapp span, .btn-fiverr span { display: none; }
    }
  </style>
</head>
