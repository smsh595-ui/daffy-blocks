<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daffy Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SCREEN 1: ARCADE LOBBY / HOME -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-content">
      <div class="glow-orb"></div>
      <h1 class="brand-title-main">DAFFY <span>ARCADE</span></h1>
      <p class="brand-sub">CHOOSE YOUR MISSION</p>

      <div class="games-grid">
        <!-- Active Game -->
        <div class="game-card active-card" id="btn-launch-blocks">
          <div class="card-tag">PLAY NOW</div>
          <div class="card-icon">🧱</div>
          <h3>BLOCKS 3D</h3>
          <p>Cyber Neon Tetris</p>
        </div>

        <!-- Locked Game 1 -->
        <div class="game-card locked-card">
          <div class="card-tag lock-tag">LOCKED</div>
          <div class="card-icon">🐍</div>
          <h3>NEON SNAKE</h3>
          <p>Coming Soon</p>
        </div>

        <!-- Locked Game 2 -->
        <div class="game-card locked-card">
          <div class="card-tag lock-tag">LOCKED</div>
          <div class="card-icon">🚀</div>
          <h3>SPACE DODGE</h3>
          <p>Coming Soon</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: DAFFY BLOCKS GAMEPLAY -->
  <div id="game-screen" class="screen">
    <div class="arcade-wrapper">
      <div class="top-navigation">
        <button id="btn-back-lobby" class="nav-back-btn">◀ MENU</button>
        <div class="game-mini-title">DAFFY BLOCKS <span>3D</span></div>
      </div>

      <div class="hud">
        <div class="hud-card">
          <span class="hud-label">LEVEL</span>
          <div id="level" class="hud-value level-value">1</div>
        </div>
        <div class="hud-card">
          <span class="hud-label">SCORE</span>
          <div id="score" class="hud-value">0</div>
        </div>
        <div class="hud-card">
          <span class="hud-label">LINES</span>
          <div id="lines" class="hud-value">0</div>
        </div>
      </div>

      <div class="board-stage">
        <div id="level-banner" class="level-banner">LEVEL UP!</div>
        <canvas id="tetris" width="280" height="560"></canvas>
      </div>

      <div class="controls-panel">
        <button id="btn-left" class="game-btn">◀</button>
        <button id="btn-rotate" class="game-btn btn-action">🔄</button>
        <button id="btn-right" class="game-btn">▶</button>
        <button id="btn-drop" class="game-btn btn-action">⚡</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
