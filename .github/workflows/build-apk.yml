name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: npm install

      - name: Sync Web Assets
        run: |
          mkdir -p www
          cp -r index.html styles.css script.js www/ 2>/dev/null || true
          npx cap sync android

      - name: Force Custom Logo and App Name
        run: |
          python3 -m pip install pillow
          python3 -c "
          import os, re, shutil
          from PIL import Image

          # 1. Search for uploaded image
          candidates = [
              'icon.png', 'Icon.png', 'logo.png', 'Logo.png',
              'assets/icon.png', 'assets/logo.png', 'www/icon.png'
          ]
          icon_path = next((p for p in candidates if os.path.exists(p)), None)
          if not icon_path:
              for f in os.listdir('.'):
                  if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp')) and not f.startswith('.'):
                      icon_path = f
                      break

          print(f'Selected logo image: {icon_path}')

          res_path = os.path.join('android', 'app', 'src', 'main', 'res')

          # 2. Remove default Capacitor vector files so Android uses our PNG
          anydpi_dir = os.path.join(res_path, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)
              print('Removed mipmap-anydpi-v26 (Purana vector icon khatam).')

          for d in ['drawable', 'drawable-v24']:
              vec_file = os.path.join(res_path, d, 'ic_launcher_foreground.xml')
              if os.path.exists(vec_file):
                  os.remove(vec_file)
                  print(f'Removed {vec_file}')

          # 3. Generate PNG icons for all densities
          if icon_path and os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in sizes.items():
                  target_dir = os.path.join(res_path, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
              print('KAMYABI: Naya logo har screen size par save ho gaya!')
          else:
              print('Error: Logo image nahi mili!')

          # 4. Set App Display Name
          strings_path = os.path.join(res_path, 'values', 'strings.xml')
          if os.path.exists(strings_path):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  xml = f.read()
              xml = re.sub(r'<string name=\"app_name\">.*?</string>', '<string name=\"app_name\">Daffy Arcade Game</string>', xml)
              xml = re.sub(r'<string name=\"title_activity_main\">.*?</string>', '<string name=\"title_activity_main\">Daffy Arcade Game</string>', xml)
              with open(strings_path, 'w', encoding='utf-8') as f:
                  f.write(xml)
              print('KAMYABI: App name Daffy Arcade Game update ho gaya.')
          "

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Daffy-Arcade-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
